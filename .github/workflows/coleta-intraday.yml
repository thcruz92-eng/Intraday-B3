name: Coleta intraday

# ====================================================================
# Candles de 5 e 60 min da B3 (Yahoo Finance) -> pasta dados/
#
# Lições herdadas da coleta do overnight:
#   * janelas em TODOS os dias da semana — o pregão de sexta tem rede de
#     segurança no sábado (foi exatamente esse o furo de 04/09/2026)
#   * falha de consulta não derruba o job; quem decide verde/vermelho é
#     só o passo final (--verificar), olhando o resultado
#   * commit com [skip ci]: o app lê a base direto do GitHub, republicar
#     o site no Netlify seria gasto de crédito sem ganho nenhum
#
# Aqui não existe atraso de publicação como no COTAHIST: o Yahoo já tem
# os candles do dia assim que o pregão fecha. As janelas extras existem
# para o caso de o Yahoo recusar consultas numa das execuções.
# ====================================================================

on:
  schedule:
    # Horários em UTC. Brasília = UTC-3.
    - cron: "30 22 * * *"   # 19:30 Brasília — pregão já encerrado nos dois horários da B3
    - cron: "30  2 * * *"   # 23:30 Brasília — rede de segurança
    - cron: "30 12 * * *"   # 09:30 Brasília — daqui em diante base atrasada = job VERMELHO

  workflow_dispatch:
    inputs:
      ativos:
        description: "Só estes papéis (ex: PETR4,VALE3) — em branco = universo inteiro"
        required: false
      completo:
        description: "Rebaixar tudo que o Yahoo tem (60 dias em 5 min, 2 anos em 60 min)"
        type: boolean
        default: false
      vol_min:
        description: "Universo: média aparada de 20 pregões, em R$ milhões (padrão 5)"
        required: false

concurrency:
  # duas execuções não podem se atropelar escrevendo a mesma base
  group: coleta-intraday
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"
  # Reserva quando o Yahoo recusa os IPs do GitHub: a função aovivo do
  # próprio site no Netlify faz a consulta. Preencha em
  # Settings > Secrets and variables > Actions > Variables > URL_APP
  URL_APP: ${{ vars.URL_APP }}

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      # checkout@v5 de propósito, não v6: o v6 mudou a forma de guardar a
      # credencial e o passo de publicação depende dela para o git push.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Executar coleta
        env:
          IN_ATIVOS: ${{ github.event.inputs.ativos }}
          IN_COMPLETO: ${{ github.event.inputs.completo }}
          IN_VOL_MIN: ${{ github.event.inputs.vol_min }}
        run: |
          ARGS=""
          if [ -n "$IN_ATIVOS" ]; then
            LIMPO=$(echo "$IN_ATIVOS" | tr 'a-z' 'A-Z' | tr -cd 'A-Z0-9,')
            ARGS="$ARGS --ativos $LIMPO"
          fi
          if [ "$IN_COMPLETO" = "true" ]; then
            ARGS="$ARGS --completo"
          fi
          if [ -n "$IN_VOL_MIN" ]; then
            ARGS="$ARGS --vol-min $(echo "$IN_VOL_MIN" | tr ',' '.' | tr -cd '0-9.')"
          fi
          python coleta_intraday.py $ARGS

      - name: Publicar base atualizada
        if: always()
        run: |
          git config user.name  "coleta-bot"
          git config user.email "coleta-bot@users.noreply.github.com"
          git add dados/
          if git diff --staged --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -q -m "Base intraday — $(date +'%Y-%m-%d %H:%M') [skip ci]"
          # se você subiu arquivo pelo site do GitHub durante a coleta,
          # o push é recusado; traz a sua mudança e tenta de novo
          for i in 1 2 3; do
            if git push; then exit 0; fi
            sleep 5
            git pull --rebase --autostash
          done
          exit 1

      # ÚNICO passo que decide verde ou vermelho.
      - name: Verificar se a base alcançou o último pregão
        if: always()
        run: python coleta_intraday.py --verificar
